[package]
name = "routedeck"
version = "0.1.0"
edition = "2021"
description = "Non-invasive router WebUI: detect, render, and carefully modify an existing Debian router without reinstalling it"
license = "MIT"
repository = ""

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
include_dir = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
