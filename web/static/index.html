<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RouteDeck · 路由面板</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M8 20l8-8 8 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="bg-orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="9" fill="url(#bm)"/><path d="M8 20l8-8 8 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
      </div>
      <div class="brand-name">RouteDeck<span class="brand-ver" id="brandVer">v0.1.0</span></div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/overview" data-route="overview" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>总览</span>
      </a>
      <a href="#/interfaces" data-route="interfaces" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 17v3M18 17v3M9 12h.01M13 12h.01"/></svg>
        <span>接口</span>
      </a>
      <a href="#/routes" data-route="routes" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h5.5"/></svg>
        <span>路由</span>
      </a>
      <a href="#/nat" data-route="nat" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>NAT · 防火墙</span>
      </a>
      <a href="#/dhcp" data-route="dhcp" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2.5"/></svg>
        <span>DHCP · DNS</span>
      </a>
      <a href="#/services" data-route="services" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        <span>服务 · 软件</span>
      </a>
      <a href="#/audit" data-route="audit" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
        <span>审计 · 备份</span>
      </a>
      <a href="#/detection" data-route="detection" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 7v4l2.5 2.5M20 20l-3.5-3.5"/></svg>
        <span>检测报告</span>
      </a>
      <a href="#/system" data-route="system" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 9l2 2-2 2M11 13h4"/></svg>
        <span>系统 · 任务</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="promise">
        <div class="promise-title">非侵入承诺</div>
        <div class="promise-text">检测只读 · 变更先备份 · 全程可回滚</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tb-left">
        <h1 id="pageTitle">总览</h1>
        <span class="tb-sub" id="pageSub">路由器实时状态</span>
      </div>
      <div class="tb-right">
        <span class="chip chip-mode" id="modeBadge" title="运行模式">···</span>
        <span class="chip chip-host" id="hostBadge">—</span>
        <button class="btn btn-ghost" id="btnRefresh" title="刷新">
          <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          刷新
        </button>
      </div>
    </header>

    <div class="content" id="view"><div class="loading">加载中…</div></div>
  </main>
</div>

<!-- modal root -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modalBox"></div>
</div>

<!-- toast root -->
<div class="toast-root" id="toastRoot"></div>

<script src="/js/app.js"></script>
<script src="/js/views.js"></script>
<script>RD.start();</script>
</body>
</html>
